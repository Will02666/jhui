<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a6fd4" />
  <title>冰箱随便做 · 家常菜推荐</title>
  <style>
    :root {
      --blue-50: #f0f7ff;
      --blue-100: #dcebff;
      --blue-200: #b8d6ff;
      --blue-400: #4d97ef;
      --blue-500: #1a6fd4;
      --blue-600: #1457a8;
      --blue-700: #0f4280;
      --ink: #1a2b3c;
      --ink-soft: #5a6b7c;
      --line: #d9e6f5;
      --white: #ffffff;
      --ok: #1a9a5c;
      --ok-bg: #e6f7ef;
      --warn: #c47a10;
      --warn-bg: #fff4e0;
      --miss: #c23b3b;
      --miss-bg: #fdeeee;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(26, 111, 212, 0.08);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background-color: #dce7f2;
      background-image:
        radial-gradient(rgba(120, 150, 180, 0.14) 1.2px, transparent 1.3px),
        linear-gradient(180deg, #e8f0f7 0%, #d7e3ef 100%);
      background-size: 18px 18px, 100% 100%;
      color: var(--ink);
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      transition: background-color .25s ease;
    }
    body.pick-bg {
      background-color: #fff6e8;
      background-image:
        radial-gradient(rgba(230, 170, 110, 0.18) 1.2px, transparent 1.3px),
        linear-gradient(180deg, #fff9ef 0%, #ffe8c8 100%);
      background-size: 18px 18px, 100% 100%;
    }

    button, input { font: inherit; }
    button {
      border: 0;
      cursor: pointer;
      background: none;
      color: inherit;
    }

    .app {
      width: min(720px, 100%);
      margin: 0 auto;
      min-height: 100dvh;
      padding:
        max(12px, env(safe-area-inset-top, 0px))
        max(12px, env(safe-area-inset-right, 0px))
        calc(24px + var(--safe-bottom))
        max(12px, env(safe-area-inset-left, 0px));
      position: relative;
    }
    .app.home-mode {
      width: min(480px, 100%);
      max-width: 480px;
      padding-top: max(10px, env(safe-area-inset-top, 0px));
      padding-left: max(8px, env(safe-area-inset-left, 0px));
      padding-right: max(8px, env(safe-area-inset-right, 0px));
      padding-bottom: calc(28px + var(--safe-bottom));
    }
    .app.pick-mode {
      width: min(640px, 100%);
    }

    .view { display: none; animation: fadeIn .22s ease; }
    .view.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      color: var(--blue-700);
      flex: 1;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }
    .brand .name {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--blue-700);
      letter-spacing: 0.04em;
    }
    .brand .tag {
      font-size: 0.82rem;
      color: var(--ink-soft);
    }

    /* ========== 拟物冰箱首页 ========== */
    .home-hero {
      text-align: center;
      margin-bottom: 10px;
    }
    .home-hero .name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #3d5a78;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    }
    .home-hero .tag {
      margin-top: 2px;
      font-size: 0.8rem;
      color: #6d849c;
    }

    .fridge-stage {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 4px clamp(6px, 2vw, 14px) 8px;
      overflow: visible;
    }

    .fridge {
      position: relative;
      width: 95vw;
      max-width: 480px;
      margin: 0 auto;
      border-radius:
        clamp(18px, 5.5vw, 28px)
        clamp(18px, 5.5vw, 28px)
        clamp(14px, 4.5vw, 22px)
        clamp(14px, 4.5vw, 22px);
      padding: clamp(10px, 3vw, 14px) clamp(10px, 3vw, 14px) clamp(12px, 3.2vw, 16px);
      background:
        linear-gradient(145deg, #f7fbff 0%, #d7e4f2 38%, #b9cce0 72%, #a7bdd4 100%);
      box-shadow:
        0 28px 50px rgba(60, 90, 120, 0.28),
        0 8px 16px rgba(60, 90, 120, 0.16),
        inset 0 2px 1px rgba(255,255,255,0.85),
        inset 0 -3px 6px rgba(90, 120, 150, 0.22),
        inset 4px 0 8px rgba(255,255,255,0.25),
        inset -5px 0 10px rgba(80, 110, 140, 0.18);
      border: 1px solid rgba(255,255,255,0.55);
    }
    .fridge::before {
      content: "";
      position: absolute;
      inset: clamp(6px, 1.8vw, 8px);
      border-radius:
        clamp(14px, 4.5vw, 22px)
        clamp(14px, 4.5vw, 22px)
        clamp(10px, 3.5vw, 16px)
        clamp(10px, 3.5vw, 16px);
      pointer-events: none;
      box-shadow:
        inset 0 0 0 1px rgba(170, 190, 210, 0.55),
        inset 0 8px 18px rgba(255,255,255,0.25);
    }
    .fridge::after {
      content: "";
      position: absolute;
      left: clamp(12px, 4vw, 18px);
      right: clamp(12px, 4vw, 18px);
      top: clamp(8px, 2.2vw, 10px);
      height: clamp(8px, 2vw, 10px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0));
      pointer-events: none;
    }

    .fridge-handle {
      position: absolute;
      right: clamp(-8px, -2.2vw, -10px);
      top: 28%;
      width: clamp(9px, 2.6vw, 14px);
      height: clamp(88px, 28vw, 120px);
      border-radius: clamp(5px, 1.5vw, 8px);
      background:
        linear-gradient(90deg, #9eb2c8 0%, #e8eef5 35%, #c5d3e2 70%, #8fa5bc 100%);
      box-shadow:
        2px 4px 10px rgba(50, 70, 90, 0.35),
        inset 1px 0 2px rgba(255,255,255,0.8),
        inset -1px 0 2px rgba(70, 90, 110, 0.35);
      z-index: 3;
    }
    .fridge-handle::before,
    .fridge-handle::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      height: clamp(6px, 1.6vw, 8px);
      border-radius: 4px;
      background: linear-gradient(90deg, #7f96ad, #d5deea, #7f96ad);
    }
    .fridge-handle::before { top: clamp(8px, 2vw, 10px); }
    .fridge-handle::after { bottom: clamp(8px, 2vw, 10px); }

    .fridge-led {
      position: relative;
      z-index: 2;
      margin: 4px clamp(4px, 1.5vw, 8px) 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: clamp(8px, 2.2vw, 10px) clamp(10px, 2.5vw, 12px);
      border-radius: clamp(12px, 3.5vw, 16px);
      background:
        linear-gradient(180deg, #1b2a3a 0%, #0f1a26 100%);
      box-shadow:
        inset 0 0 0 2px #2d4258,
        inset 0 8px 16px rgba(0,0,0,0.45),
        0 2px 0 rgba(255,255,255,0.35);
    }
    .fridge-led .led-text {
      flex: 1 1 140px;
      min-width: 0;
    }
    .fridge-led .led-title {
      font-size: clamp(0.64rem, 2.2vw, 0.72rem);
      letter-spacing: 0.18em;
      color: #7fd0ff;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .fridge-led .led-status {
      margin-top: 2px;
      font-size: clamp(0.82rem, 3.2vw, 0.92rem);
      font-weight: 700;
      color: #c9e9ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fridge-led .led-status.off { color: #6b8094; }

    .recommend-knob {
      position: relative;
      width: clamp(64px, 18vw, 78px);
      height: clamp(64px, 18vw, 78px);
      border-radius: 50%;
      flex: 0 0 auto;
      margin-left: auto;
      color: #d9e7f5;
      font-weight: 800;
      font-size: clamp(0.7rem, 2.4vw, 0.78rem);
      line-height: 1.15;
      letter-spacing: 0.04em;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      background:
        radial-gradient(circle at 35% 30%, #6a7f96 0%, #3d5166 45%, #243445 100%);
      box-shadow:
        0 6px 0 #1a2734,
        0 10px 16px rgba(0,0,0,0.35),
        inset 0 2px 4px rgba(255,255,255,0.25),
        inset 0 -4px 8px rgba(0,0,0,0.35);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .recommend-knob span {
      display: block;
      transform: translateY(1px);
    }
    .recommend-knob.is-on {
      color: #f3fbff;
      background:
        radial-gradient(circle at 35% 28%, #6ec8ff 0%, #1f8fe8 42%, #0d5fb0 100%);
      box-shadow:
        0 6px 0 #0a4a8a,
        0 10px 18px rgba(20, 110, 200, 0.45),
        inset 0 2px 5px rgba(255,255,255,0.45),
        inset 0 -4px 8px rgba(0,40,90,0.35),
        0 0 18px rgba(70, 180, 255, 0.45);
    }
    .recommend-knob:active:not(:disabled) {
      transform: translateY(4px) scale(0.94);
      filter: brightness(0.92);
      box-shadow:
        0 2px 0 #1a2734,
        0 4px 10px rgba(0,0,0,0.28),
        inset 0 2px 5px rgba(255,255,255,0.25),
        inset 0 -2px 6px rgba(0,0,0,0.35);
    }
    .recommend-knob.is-on:active:not(:disabled) {
      box-shadow:
        0 2px 0 #0a4a8a,
        0 4px 10px rgba(20, 110, 200, 0.35),
        inset 0 2px 5px rgba(255,255,255,0.35),
        inset 0 -2px 6px rgba(0,40,90,0.4),
        0 0 10px rgba(70, 180, 255, 0.3);
    }
    .recommend-knob:disabled {
      cursor: not-allowed;
      filter: grayscale(0.35) brightness(0.9);
    }

    .fridge-door {
      position: relative;
      z-index: 1;
      border-radius: clamp(12px, 3.8vw, 18px);
      overflow: hidden;
      background:
        linear-gradient(180deg, #eef6ff 0%, #dceaf8 100%);
      box-shadow:
        inset 0 0 0 1px rgba(150, 175, 200, 0.45),
        inset 0 10px 24px rgba(255,255,255,0.55),
        inset 0 -8px 18px rgba(120, 150, 180, 0.18);
    }

    .zone {
      position: relative;
      padding: 12px 12px 10px;
    }
    .zone-cold {
      min-height: 250px;
      border-bottom: 2px dashed rgba(130, 160, 190, 0.45);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.35), rgba(210, 230, 250, 0.15));
    }
    .zone-seasoning {
      min-height: 132px;
      background:
        linear-gradient(180deg, rgba(255, 248, 230, 0.35), rgba(255,255,255,0.1));
      padding-bottom: 14px;
    }
    .zone-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #4d6d8c;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(170, 195, 220, 0.7);
      box-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }
    .zone-label .count {
      min-width: 16px;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      background: #5b8fc7;
      color: #fff;
      font-size: 0.68rem;
      line-height: 16px;
      text-align: center;
    }

    .magnet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px 8px;
      align-content: start;
    }
    .fridge-empty {
      position: absolute;
      inset: 42px 12px 16px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #7d93a8;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.55;
      pointer-events: none;
    }
    .fridge-empty.show { display: flex; }
    .zone-seasoning .fridge-empty {
      inset: 40px 12px 12px;
      font-size: 0.84rem;
    }

    .magnet {
      --tilt: -2deg;
      position: relative;
      min-height: 72px;
      min-width: 0;
      border: 0;
      border-radius: 14px;
      padding: 10px 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background:
        linear-gradient(160deg, #fffef8 0%, #fff4d8 55%, #ffe8b8 100%);
      box-shadow:
        0 5px 0 rgba(180, 140, 70, 0.22),
        0 8px 14px rgba(90, 110, 140, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.9);
      transform: rotate(var(--tilt));
      transition: transform .18s ease, box-shadow .18s ease, filter .12s ease;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .magnet::before {
      content: "";
      position: absolute;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ff8e8e, #e24545 60%, #a81f1f);
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    .magnet .emoji { font-size: 1.45rem; line-height: 1; margin-top: 6px; }
    .magnet .label {
      font-size: 0.74rem;
      font-weight: 700;
      color: #5a4630;
      word-break: break-all;
      line-height: 1.2;
    }
    .magnet .del-hint {
      position: absolute;
      right: 5px;
      top: 4px;
      font-size: 0.62rem;
      color: rgba(160, 90, 60, 0.55);
      font-weight: 700;
    }
    .magnet:nth-child(3n+1) { --tilt: -3deg; background: linear-gradient(160deg, #fff 0%, #e8f4ff 60%, #d5e9ff 100%); }
    .magnet:nth-child(3n+2) { --tilt: 2.5deg; background: linear-gradient(160deg, #fffef5 0%, #ffe9c8 55%, #ffd9a0 100%); }
    .magnet:nth-child(3n) { --tilt: -1.5deg; background: linear-gradient(160deg, #fff 0%, #e9f8ef 60%, #cfeedd 100%); }
    .magnet:nth-child(4n) { --tilt: 3deg; }
    @media (hover: hover) and (pointer: fine) {
      .magnet:hover,
      .magnet:focus-visible {
        animation: magnet-wiggle 1.1s ease-in-out infinite;
        z-index: 2;
        box-shadow:
          0 8px 0 rgba(180, 140, 70, 0.18),
          0 14px 20px rgba(90, 110, 140, 0.2),
          inset 0 1px 0 rgba(255,255,255,0.9);
      }
    }
    .magnet:active {
      animation: none !important;
      transform: rotate(var(--tilt)) scale(0.9);
      filter: brightness(0.92);
    }
    @keyframes magnet-wiggle {
      0%, 100% { transform: translateY(0) rotate(var(--tilt)); }
      25% { transform: translateY(-5px) rotate(calc(var(--tilt) + 2deg)); }
      50% { transform: translateY(-2px) rotate(calc(var(--tilt) - 1deg)); }
      75% { transform: translateY(-6px) rotate(calc(var(--tilt) + 1.5deg)); }
    }

    .jar-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px 8px;
      align-content: start;
    }
    .jar {
      --tilt: 2deg;
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 64px;
      padding: 10px 6px 8px;
      border-radius: 10px 10px 12px 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.95), rgba(240, 248, 255, 0.92));
      border: 1px solid rgba(160, 190, 220, 0.7);
      box-shadow:
        0 4px 0 rgba(120, 150, 180, 0.18),
        0 6px 12px rgba(80, 110, 140, 0.12);
      transform: rotate(var(--tilt));
      text-align: center;
      transition: transform .18s ease, filter .12s ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .jar::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 50%;
      width: 28px;
      height: 8px;
      margin-left: -14px;
      border-radius: 4px;
      background: linear-gradient(180deg, #d7e4f2, #9eb6ce);
      box-shadow: 0 1px 1px rgba(0,0,0,0.12);
    }
    .jar .emoji { display: block; font-size: 1.15rem; margin-top: 2px; }
    .jar .label {
      display: block;
      margin-top: 2px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #45627f;
      word-break: break-all;
      line-height: 1.15;
    }
    .jar:nth-child(2n) { --tilt: -2.5deg; }
    .jar:nth-child(3n) { --tilt: 1.5deg; }
    @media (hover: hover) and (pointer: fine) {
      .jar:hover,
      .jar:focus-visible {
        animation: magnet-wiggle 1.1s ease-in-out infinite;
        z-index: 2;
      }
    }
    .jar:active {
      animation: none !important;
      transform: rotate(var(--tilt)) scale(0.9);
      filter: brightness(0.92);
    }

    .sticky-notes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 10px 12px;
      margin: 12px 4px calc(6px + env(safe-area-inset-bottom, 0px) * 0.15);
      position: relative;
      z-index: 2;
    }
    .sticky {
      position: relative;
      flex: 1 1 42%;
      width: 45%;
      max-width: calc(50% - 6px);
      min-width: 120px;
      min-height: 56px;
      padding: 14px 10px;
      border-radius: 3px;
      font-weight: 800;
      font-size: clamp(0.84rem, 3.4vw, 0.92rem);
      line-height: 1.25;
      text-align: center;
      box-shadow:
        1px 4px 10px rgba(80, 100, 120, 0.22),
        inset 0 1px 0 rgba(255,255,255,0.55);
      transition: transform .15s ease, box-shadow .15s ease, filter .12s ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .sticky-main {
      background: linear-gradient(160deg, #fff7a8, #ffe56d);
      color: #6b5310;
      transform: rotate(-3deg);
    }
    .sticky-seasoning {
      background: linear-gradient(160deg, #d9f4ff, #9fd8ff);
      color: #1d5578;
      transform: rotate(2.5deg);
    }
    .sticky::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      width: 28px;
      height: 10px;
      margin-left: -14px;
      border-radius: 2px;
      background: rgba(255,255,255,0.45);
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
      transform: rotate(-2deg);
    }
    .sticky-main:active {
      transform: rotate(-3deg) scale(0.93) translateY(2px);
      filter: brightness(0.94);
    }
    .sticky-seasoning:active {
      transform: rotate(2.5deg) scale(0.93) translateY(2px);
      filter: brightness(0.94);
    }

    .fridge-feet {
      display: flex;
      justify-content: space-between;
      width: 95vw;
      max-width: 480px;
      margin: -2px auto 0;
      padding: 0 clamp(24px, 8vw, 34px);
    }
    .fridge-feet span {
      width: 28px;
      height: 10px;
      border-radius: 0 0 6px 6px;
      background: linear-gradient(180deg, #8ea4bb, #6d849c);
      box-shadow: 0 3px 6px rgba(60, 80, 100, 0.35);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--white);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--blue-600);
      flex-shrink: 0;
      transition: background .15s ease, transform .15s ease;
    }
    .icon-btn:active { transform: scale(0.96); background: var(--blue-50); }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--blue-400), var(--blue-500));
      color: var(--white);
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(26, 111, 212, 0.25);
      transition: transform .15s ease, filter .15s ease;
    }
    .primary-btn:active { transform: scale(0.98); filter: brightness(0.96); }
    .primary-btn.full { width: 100%; }
    .primary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .ghost-btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--blue-600);
      font-weight: 600;
    }
    .ghost-btn:active { background: var(--blue-50); }

    .panel {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 2px);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--blue-700);
    }
    .count-pill {
      font-size: 0.78rem;
      color: var(--blue-600);
      background: var(--blue-100);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }
    .item-chip {
      position: relative;
      min-height: 92px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, var(--blue-50));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      text-align: center;
      transition: transform .12s ease, border-color .12s ease;
    }
    .item-chip:active { transform: scale(0.97); }
    .item-chip .emoji { font-size: 1.5rem; line-height: 1; }
    .item-chip .label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      word-break: break-all;
    }
    .item-chip .del {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(194, 59, 59, 0.1);
      color: var(--miss);
      font-size: 14px;
      line-height: 20px;
      opacity: 0.85;
    }

    .seasoning-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .seasoning-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blue-50);
      border: 1px solid var(--blue-200);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--blue-700);
    }
    .seasoning-chip .x {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(26, 111, 212, 0.12);
      color: var(--blue-600);
      font-size: 12px;
      line-height: 18px;
      text-align: center;
    }

    .empty {
      text-align: center;
      color: var(--ink-soft);
      padding: 18px 8px;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .sticky-cta {
      position: sticky;
      bottom: calc(10px + var(--safe-bottom));
      margin-top: 18px;
      z-index: 5;
    }

    /* ========== 添加食材 / 调料页 ========== */
    .pick-topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 12px;
      margin-bottom: 16px;
    }
    .pick-topbar h1 {
      margin: 0;
      flex: 1;
      min-width: 0;
      font-size: 1.28rem;
      font-weight: 800;
      color: #5a4630;
      letter-spacing: 0.03em;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Rounded Mplus 1c", var(--font);
    }
    .back-fridge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 0 14px 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow:
        0 4px 12px rgba(160, 120, 70, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.9);
      color: #7a5a2e;
      font-size: 0.88rem;
      font-weight: 800;
      transition: transform .12s ease, background .12s ease, filter .12s ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .back-fridge:active {
      transform: scale(0.94);
      background: #fff;
      filter: brightness(0.96);
    }
    .back-fridge .arrow {
      font-size: 1.05rem;
      line-height: 1;
    }

    .pick-tools {
      margin-bottom: 18px;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-bar input,
    .manual-row input {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      background: #fff;
      outline: none;
      color: var(--ink);
      box-shadow:
        inset 0 2px 6px rgba(120, 100, 70, 0.08),
        0 2px 0 rgba(255,255,255,0.8),
        0 6px 14px rgba(160, 130, 80, 0.08);
    }
    .search-bar input::placeholder,
    .manual-row input::placeholder {
      color: #b3a28a;
    }
    .search-bar input:focus,
    .manual-row input:focus {
      box-shadow:
        inset 0 2px 6px rgba(120, 100, 70, 0.06),
        0 0 0 3px rgba(255, 186, 90, 0.28),
        0 6px 14px rgba(160, 130, 80, 0.1);
    }

    .manual-row {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
    }
    .manual-row button {
      flex-shrink: 0;
      min-width: 88px;
      min-height: 48px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd56a, #ffb938);
      color: #7a4e00;
      font-weight: 800;
      padding: 0 16px;
      box-shadow:
        0 4px 0 #e09a1c,
        0 8px 14px rgba(220, 150, 40, 0.28);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .manual-row button:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #e09a1c,
        0 4px 8px rgba(220, 150, 40, 0.22);
    }
    .view[data-view="add-seasoning"] .manual-row button {
      background: linear-gradient(180deg, #ffb4c8, #ff7fa3);
      color: #7a2040;
      box-shadow:
        0 4px 0 #e4587f,
        0 8px 14px rgba(230, 100, 140, 0.28);
    }
    .view[data-view="add-seasoning"] .manual-row button:active {
      box-shadow:
        0 2px 0 #e4587f,
        0 4px 8px rgba(230, 100, 140, 0.22);
    }

    .cat-block { margin-bottom: 20px; }
    .cat-title {
      margin: 0 0 12px;
      font-size: 1rem;
      color: #6b5538;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Rounded Mplus 1c", var(--font);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 12px 10px;
    }
    .preset-item {
      min-height: 88px;
      border-radius: 22px;
      border: 1.5px solid rgba(255,255,255,0.85);
      background: rgba(255, 255, 255, 0.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 12px 8px 10px;
      position: relative;
      box-shadow:
        0 6px 14px rgba(140, 120, 90, 0.12),
        0 1px 0 rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease, filter .12s ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .preset-item .emoji {
      font-size: 1.7rem;
      line-height: 1;
    }
    .preset-item .label {
      font-size: 0.82rem;
      font-weight: 800;
      color: #5a4630;
      line-height: 1.2;
    }
    .preset-item:active {
      transform: scale(0.93);
      filter: brightness(0.94);
    }
    .preset-item.added {
      border-color: rgba(70, 180, 120, 0.55);
      background: linear-gradient(160deg, rgba(220, 250, 230, 0.95), rgba(190, 236, 210, 0.92));
      box-shadow:
        0 6px 14px rgba(60, 150, 100, 0.16),
        0 0 0 2px rgba(90, 190, 130, 0.18);
    }
    .preset-item.added .label { color: #1f7a4a; }
    .preset-item.added .check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #2fbf6e;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(40, 150, 90, 0.35);
    }
    .preset-item.pop {
      animation: sticker-pop .28s ease;
    }
    @keyframes sticker-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .pick-hint {
      margin: 0 0 14px;
      font-size: 0.84rem;
      color: #9a8060;
      font-weight: 600;
    }

    .reshuffle-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd56a, #ffb938);
      color: #7a4e00;
      font-weight: 800;
      font-size: 0.86rem;
      box-shadow:
        0 3px 0 #e09a1c,
        0 6px 12px rgba(220, 150, 40, 0.25);
      transition: transform .12s ease, box-shadow .12s ease;
      white-space: nowrap;
    }
    .reshuffle-btn:active {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #e09a1c,
        0 3px 8px rgba(220, 150, 40, 0.2);
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .recipe-card {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.78);
      border: 1.5px solid rgba(255,255,255,0.9);
      border-radius: 22px;
      padding: 16px 16px 14px;
      box-shadow:
        0 8px 18px rgba(140, 120, 90, 0.12),
        0 1px 0 rgba(255,255,255,0.95);
      backdrop-filter: blur(6px);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease, filter .12s ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .recipe-card:active {
      transform: scale(0.97);
      filter: brightness(0.95);
    }
    .recipe-card .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .recipe-card h3 {
      margin: 0;
      font-size: 1.14rem;
      font-weight: 800;
      color: #5a4630;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Rounded Mplus 1c", var(--font);
      letter-spacing: 0.02em;
    }
    .recipe-card .card-emoji {
      font-size: 1.45rem;
      line-height: 1;
      margin-right: 2px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: #9a8060;
      font-size: 0.86rem;
      font-weight: 600;
    }
    .missing-note {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 248, 235, 0.85);
      font-size: 0.84rem;
      color: #8a6d4a;
      line-height: 1.45;
      font-weight: 600;
    }
    .missing-note.ok {
      background: rgba(220, 250, 230, 0.85);
      color: #2a7a4e;
    }
    .results-empty {
      text-align: center;
      color: #9a8060;
      padding: 36px 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      font-weight: 600;
      background: rgba(255,255,255,0.55);
      border-radius: 22px;
      box-shadow: 0 6px 14px rgba(140, 120, 90, 0.08);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .tag.perfect { background: #ddf7e8; color: #1f8a4e; }
    .tag.seasoning { background: #fff0d2; color: #c47a10; }
    .tag.main { background: #ffe3e3; color: #c23b3b; }
    .tag.soft { background: rgba(255, 255, 255, 0.85); color: #7a5a2e; border: 1px solid rgba(200, 170, 120, 0.35); }

    .detail-hero {
      margin-bottom: 14px;
    }
    .detail-hero h1 {
      margin: 0 0 10px;
      font-size: 1.55rem;
      color: var(--blue-700);
    }
    .ing-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--blue-50);
      border: 1px solid transparent;
    }
    .ing-row.have {
      background: var(--ok-bg);
      border-color: rgba(26, 154, 92, 0.2);
    }
    .ing-row.lack {
      background: var(--miss-bg);
      border-color: rgba(194, 59, 59, 0.18);
    }
    .ing-row .left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ing-row .name { font-weight: 700; font-size: 0.95rem; }
    .ing-row .amount { font-size: 0.8rem; color: var(--ink-soft); }
    .ing-row .status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.75);
    }
    .ing-row.have .status { color: var(--ok); }
    .ing-row.lack .status { color: var(--miss); }

    .steps {
      margin: 0;
      padding-left: 0;
      list-style: none;
      counter-reset: step;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .steps li {
      counter-increment: step;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: start;
      line-height: 1.55;
      color: var(--ink);
      font-size: 0.95rem;
    }
    .steps li::before {
      content: counter(step);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--blue-500);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      margin-top: 1px;
    }

    .tip-box {
      margin-top: 4px;
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(180deg, #fff8eb, #fff3db);
      border: 1px solid #f0dfb8;
      color: #8a5a12;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + var(--safe-bottom));
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 66, 128, 0.94);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 50;
      max-width: calc(100% - 40px);
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 窄屏：LED 上下排，便利贴防挤 */
    @media (max-width: 380px) {
      .fridge-led {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .fridge-led .led-text {
        flex: 1 1 auto;
      }
      .fridge-led .led-status {
        white-space: normal;
      }
      .recommend-knob {
        margin: 2px auto 0;
        width: 70px;
        height: 70px;
      }
      .sticky {
        flex: 1 1 calc(50% - 8px);
        width: calc(50% - 8px);
        max-width: none;
        min-width: 0;
        font-size: 0.82rem;
        min-height: 52px;
        padding: 12px 6px;
      }
      .sticky-main { transform: rotate(-2deg); }
      .sticky-seasoning { transform: rotate(2deg); }
      .sticky-main:active { transform: rotate(-2deg) scale(0.93) translateY(2px); }
      .sticky-seasoning:active { transform: rotate(2deg) scale(0.93) translateY(2px); }
      .zone-cold { min-height: 210px; }
    }

    @media (max-width: 320px) {
      .sticky-notes {
        flex-direction: column;
        align-items: stretch;
      }
      .sticky {
        width: 100%;
        max-width: none;
        flex: 1 1 auto;
        transform: none !important;
      }
      .sticky-main:active,
      .sticky-seasoning:active {
        transform: scale(0.96) translateY(2px) !important;
      }
    }

    @media (min-width: 720px) {
      .app { padding-top: 28px; }
      .app.home-mode {
        margin-left: auto;
        margin-right: auto;
      }
      .fridge,
      .fridge-feet {
        width: 100%;
        max-width: 480px;
      }
    }

    /* 桌面才启用悬停上浮，手机靠 :active */
    @media (hover: hover) and (pointer: fine) {
      .preset-item:hover,
      .preset-item:focus-visible {
        transform: translateY(-4px) scale(1.04);
        box-shadow:
          0 12px 22px rgba(140, 120, 90, 0.18),
          0 1px 0 rgba(255,255,255,0.95);
        background: rgba(255, 255, 255, 0.92);
      }
      .recipe-card:hover,
      .recipe-card:focus-visible {
        transform: translateY(-4px) scale(1.01);
        background: rgba(255, 255, 255, 0.94);
        box-shadow:
          0 14px 26px rgba(140, 120, 90, 0.16),
          0 1px 0 rgba(255,255,255,0.98);
      }
    }
  </style>
</head>
<body>
  <div class="app home-mode" id="app">
    <!-- 首页：拟物冰箱 -->
    <section class="view active" id="view-home" data-view="home">
      <div class="home-hero">
        <div class="name">冰箱随便做</div>
        <div class="tag">打开冰箱，随机一道家常菜</div>
      </div>

      <div class="fridge-stage">
        <div class="fridge" aria-label="我的冰箱">
          <div class="fridge-handle" aria-hidden="true"></div>

          <div class="fridge-led">
            <div class="led-text">
              <div class="led-title">FRIDGE · MENU</div>
              <div class="led-status off" id="led-status">等待放入食材…</div>
            </div>
            <button class="recommend-knob" type="button" id="btn-recommend" disabled>
              <span>随机<br>推荐</span>
            </button>
          </div>

          <div class="fridge-door">
            <div class="zone zone-cold">
              <div class="zone-label">❄ 冷藏区 · 主食材 <span class="count" id="main-count">0</span></div>
              <div class="magnet-grid" id="fridge-mains"></div>
              <div class="fridge-empty show" id="mains-empty">冰箱空空如也，快去采购吧 🛒</div>
            </div>

            <div class="zone zone-seasoning">
              <div class="zone-label">🧂 调料架 <span class="count" id="seasoning-count">0</span></div>
              <div class="jar-row" id="fridge-seasonings"></div>
              <div class="fridge-empty show" id="seasonings-empty">调料架空空的，贴一张便利贴去添加吧</div>
            </div>
          </div>

          <div class="sticky-notes">
            <button class="sticky sticky-main" type="button" data-nav="add-main">＋ 添加食材</button>
            <button class="sticky sticky-seasoning" type="button" data-nav="add-seasoning">＋ 添加调料</button>
          </div>
        </div>
      </div>
      <div class="fridge-feet" aria-hidden="true"><span></span><span></span></div>
    </section>

    <!-- 添加食材 -->
    <section class="view" id="view-add-main" data-view="add-main">
      <div class="pick-topbar">
        <button class="back-fridge" type="button" data-nav="home" aria-label="返回冰箱">
          <span class="arrow">‹</span> 返回冰箱
        </button>
        <h1>🛒 挑选食材</h1>
      </div>
      <div class="pick-tools">
        <div class="search-bar">
          <input id="search-main" type="search" placeholder="🔍 搜一搜，如西红柿、鸡蛋" autocomplete="off" />
        </div>
        <div class="manual-row">
          <input id="custom-main" type="text" placeholder="没有的话，自己写一个吧" maxlength="20" />
          <button type="button" id="btn-custom-main">添加</button>
        </div>
      </div>
      <p class="pick-hint">点贴纸就能放进冰箱，再点一次可取消哦</p>
      <div id="preset-mains"></div>
    </section>

    <!-- 添加调料 -->
    <section class="view" id="view-add-seasoning" data-view="add-seasoning">
      <div class="pick-topbar">
        <button class="back-fridge" type="button" data-nav="home" aria-label="返回冰箱">
          <span class="arrow">‹</span> 返回冰箱
        </button>
        <h1>🧂 挑选调料</h1>
      </div>
      <div class="pick-tools">
        <div class="search-bar">
          <input id="search-seasoning" type="search" placeholder="🔍 搜一搜，如生抽、蚝油" autocomplete="off" />
        </div>
        <div class="manual-row">
          <input id="custom-seasoning" type="text" placeholder="没有的话，自己写一个吧" maxlength="20" />
          <button type="button" id="btn-custom-seasoning">添加</button>
        </div>
      </div>

    const STORAGE_KEY = "fridge_cook_v1";
    const state = {
      fridge: loadFridge(),
      lastResults: [],
      currentRecipeId: null,
      fromResults: false
    };

    function loadFridge() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { mains: [], seasonings: [] };
        const parsed = JSON.parse(raw);
        return {
          mains: Array.isArray(parsed.mains) ? parsed.mains : [],
          seasonings: Array.isArray(parsed.seasonings) ? parsed.seasonings : []
        };
      } catch (e) {
        return { mains: [], seasonings: [] };
      }
    }

    function saveFridge() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.fridge));
    }

    /* ========== 别名归一化 ========== */
    const aliasMap = buildAliasMap();

    function buildAliasMap() {
      const map = new Map();
      PRESET_ITEMS.forEach((item) => {
        const canonical = normalizeText(item.name);
        map.set(canonical, item.name);
        (item.aliases || []).forEach((a) => map.set(normalizeText(a), item.name));
      });
      return map;
    }

    function normalizeText(text) {
      return String(text || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    function canonicalName(name) {
      const key = normalizeText(name);
      return aliasMap.get(key) || String(name || "").trim();
    }

    function namesEqual(a, b) {
      return canonicalName(a) === canonicalName(b);
    }

    function findPreset(name) {
      const c = canonicalName(name);
      return PRESET_ITEMS.find((p) => canonicalName(p.name) === c) || null;
    }

    function iconFor(name, isSeasoning) {
      const preset = findPreset(name);
      if (preset) return preset.icon;
      return isSeasoning ? "🧴" : "🥗";
    }

    /* ========== 冰箱操作 ========== */
    function hasInFridge(name, isSeasoning) {
      const list = isSeasoning ? state.fridge.seasonings : state.fridge.mains;
      return list.some((n) => namesEqual(n, name));
    }

    function ownsIngredient(name) {
      const c = canonicalName(name);
      return (
        state.fridge.mains.some((n) => canonicalName(n) === c) ||
        state.fridge.seasonings.some((n) => canonicalName(n) === c)
      );
    }

    function addToFridge(name, isSeasoning) {
      const clean = String(name || "").trim();
      if (!clean) {
        toast("请输入名称");
        return false;
      }
      const finalName = canonicalName(clean);
      const list = isSeasoning ? state.fridge.seasonings : state.fridge.mains;
      if (list.some((n) => namesEqual(n, finalName))) {
        toast("已经在冰箱里了");
        return false;
      }
      // 若用户把调料加到主料区或反过来，仍按入口类型存放
      list.push(finalName);
      saveFridge();
      toast(`已添加${isSeasoning ? "调料" : "食材"}：${finalName}`);
      return true;
    }

    function removeFromFridge(name, isSeasoning) {
      if (isSeasoning) {
        state.fridge.seasonings = state.fridge.seasonings.filter((n) => !namesEqual(n, name));
      } else {
        state.fridge.mains = state.fridge.mains.filter((n) => !namesEqual(n, name));
      }
      saveFridge();
      toast(`已移除：${canonicalName(name)}`);
    }

    /* ========== 匹配逻辑 ========== */
    const MATCH = {
      PERFECT: "perfect",
      MISS_SEASONING: "seasoning",
      MISS_ONE_MAIN: "main"
    };

    function matchRecipe(recipe) {
      const requiredMains = recipe.mains.filter((x) => x.required);
      const optionalMains = recipe.mains.filter((x) => !x.required);
      const requiredSeasonings = recipe.seasonings.filter((x) => x.required);

      const missingMains = requiredMains
        .filter((x) => !ownsIngredient(x.name))
        .map((x) => x.name);
      const missingSeasonings = requiredSeasonings
        .filter((x) => !ownsIngredient(x.name))
        .map((x) => x.name);

      // 可选主料缺失不影响推荐资格，但可在详情展示
      if (missingMains.length >= 2) {
        return null;
      }

      let level;
      let label;
      if (missingMains.length === 0 && missingSeasonings.length === 0) {
        level = MATCH.PERFECT;
        label = "完美匹配";
      } else if (missingMains.length === 0 && missingSeasonings.length > 0) {
        level = MATCH.MISS_SEASONING;
        label = "差调料";
      } else if (missingMains.length === 1) {
        level = MATCH.MISS_ONE_MAIN;
        label = "差一样主料";
      } else {
        return null;
      }

      return {
        recipe,
        level,
        label,
        missingMains,
        missingSeasonings,
        optionalMissingMains: optionalMains
          .filter((x) => !ownsIngredient(x.name))
          .map((x) => x.name)
      };
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function recommend(limit = 6) {
      const matched = RECIPES.map(matchRecipe).filter(Boolean);
      const buckets = {
        [MATCH.PERFECT]: shuffle(matched.filter((m) => m.level === MATCH.PERFECT)),
        [MATCH.MISS_SEASONING]: shuffle(matched.filter((m) => m.level === MATCH.MISS_SEASONING)),
        [MATCH.MISS_ONE_MAIN]: shuffle(matched.filter((m) => m.level === MATCH.MISS_ONE_MAIN))
      };

      const result = [];
      for (const key of [MATCH.PERFECT, MATCH.MISS_SEASONING, MATCH.MISS_ONE_MAIN]) {
        for (const item of buckets[key]) {
          if (result.length >= limit) break;
          result.push(item);
        }
        if (result.length >= limit) break;
      }
      return result;
    }

    /* ========== 视图切换 ========== */
    function showView(name) {
      document.querySelectorAll(".view").forEach((el) => {
        el.classList.toggle("active", el.dataset.view === name);
      });
      const app = document.getElementById("app");
      const isPickStyle = name === "add-main" || name === "add-seasoning" || name === "results";
      app.classList.toggle("home-mode", name === "home");
      app.classList.toggle("pick-mode", isPickStyle);
      document.body.classList.toggle("pick-bg", isPickStyle);
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
      if (name === "home") renderHome();
      if (name === "add-main") renderPresetPicker(false);
      if (name === "add-seasoning") renderPresetPicker(true);
      if (name === "results") renderResults();
      if (name === "detail") renderDetail();
    }

    /* ========== 渲染 ========== */
    function renderHome() {
      const mainsEl = document.getElementById("fridge-mains");
      const seasoningsEl = document.getElementById("fridge-seasonings");
      const mainsEmpty = document.getElementById("mains-empty");
      const seasoningsEmpty = document.getElementById("seasonings-empty");
      const btn = document.getElementById("btn-recommend");
      const led = document.getElementById("led-status");

      document.getElementById("main-count").textContent = state.fridge.mains.length;
      document.getElementById("seasoning-count").textContent = state.fridge.seasonings.length;

      if (!state.fridge.mains.length) {
        mainsEl.innerHTML = "";
        mainsEmpty.classList.add("show");
      } else {
        mainsEmpty.classList.remove("show");
        mainsEl.innerHTML = state.fridge.mains.map((name) => `
          <button class="magnet" type="button" data-remove-main="${escapeAttr(name)}" title="点击删除">
            <span class="del-hint">×</span>
            <span class="emoji">${iconFor(name, false)}</span>
            <span class="label">${escapeHtml(name)}</span>
          </button>
        `).join("");
      }

      if (!state.fridge.seasonings.length) {
        seasoningsEl.innerHTML = "";
        seasoningsEmpty.classList.add("show");
      } else {
        seasoningsEmpty.classList.remove("show");
        seasoningsEl.innerHTML = state.fridge.seasonings.map((name) => `
          <button class="jar" type="button" data-remove-seasoning="${escapeAttr(name)}" title="点击删除">
            <span class="emoji">${iconFor(name, true)}</span>
            <span class="label">${escapeHtml(name)}</span>
          </button>
        `).join("");
      }

      const canRecommend = state.fridge.mains.length > 0 || state.fridge.seasonings.length > 0;
      btn.disabled = !canRecommend;
      btn.classList.toggle("is-on", canRecommend);
      if (!canRecommend) {
        led.textContent = "等待放入食材…";
        led.classList.add("off");
      } else {
        const total = state.fridge.mains.length + state.fridge.seasonings.length;
        led.textContent = `已就绪 · ${total} 样食材`;
        led.classList.remove("off");
      }
    }

    const CATEGORY_EMOJI = {
      "蛋奶豆制品": "🥚",
      "蔬菜": "🥬",
      "肉类": "🥩",
      "海鲜": "🦐",
      "主食": "🍚",
      "菌菇": "🍄",
      "基础调味": "🧂",
      "酱料": "🥫",
      "香辛料": "🌶️",
      "其他": "✨"
    };

    function renderPresetPicker(isSeasoning, popName) {
      const container = document.getElementById(isSeasoning ? "preset-seasonings" : "preset-mains");
      const searchInput = document.getElementById(isSeasoning ? "search-seasoning" : "search-main");
      const q = normalizeText(searchInput.value);

      const items = PRESET_ITEMS.filter((p) => p.isSeasoning === isSeasoning)
        .filter((p) => {
          if (!q) return true;
          const hay = [p.name, ...(p.aliases || [])].map(normalizeText).join("|");
          return hay.includes(q);
        });

      const groups = {};
      items.forEach((item) => {
        if (!groups[item.category]) groups[item.category] = [];
        groups[item.category].push(item);
      });

      if (!items.length) {
        container.innerHTML = `<div class="empty">没有找到匹配的${isSeasoning ? "调料" : "食材"}，可用上方手动添加</div>`;
        return;
      }

      container.innerHTML = Object.keys(groups).map((cat) => {
        const emoji = CATEGORY_EMOJI[cat] || "📌";
        return `
        <div class="cat-block">
          <h3 class="cat-title"><span>${emoji}</span><span>${escapeHtml(cat)}</span></h3>
          <div class="preset-grid">
            ${groups[cat].map((item) => {
              const added = hasInFridge(item.name, isSeasoning);
              const pop = popName && namesEqual(popName, item.name) ? "pop" : "";
              return `
                <button
                  class="preset-item ${added ? "added" : ""} ${pop}"
                  type="button"
                  data-add-preset="${escapeAttr(item.name)}"
                  data-is-seasoning="${isSeasoning ? "1" : "0"}"
                  aria-pressed="${added ? "true" : "false"}"
                >
                  ${added ? `<span class="check" aria-hidden="true">✔</span>` : ""}
                  <span class="emoji">${item.icon}</span>
                  <span class="label">${escapeHtml(item.name)}</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
      }).join("");
    }

    function matchEmoji(level) {
      if (level === MATCH.PERFECT) return "✨";
      if (level === MATCH.MISS_SEASONING) return "🧂";
      return "🥬";
    }

    function renderResults() {
      const list = document.getElementById("result-list");
      const empty = document.getElementById("results-empty");
      const results = state.lastResults;

      if (!results.length) {
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      list.innerHTML = results.map((m) => {
        const missParts = [];
        if (m.missingSeasonings.length) missParts.push(`缺调料：${m.missingSeasonings.join("、")}`);
        if (m.missingMains.length) missParts.push(`缺主料：${m.missingMains.join("、")}`);
        const noteClass = missParts.length ? "" : "ok";
        const noteText = missParts.length
          ? missParts.join(" · ")
          : "冰箱里的东西刚好能做，动手吧！";
        return `
          <button class="recipe-card" type="button" data-open-recipe="${escapeAttr(m.recipe.id)}">
            <div class="title-row">
              <h3><span class="card-emoji">${matchEmoji(m.level)}</span>${escapeHtml(m.recipe.name)}</h3>
              <span class="tag ${m.level}">${escapeHtml(m.label)}</span>
            </div>
            <div class="meta-row">
              <span class="tag soft">${escapeHtml(m.recipe.difficulty)}</span>
              <span>⏱ 约 ${m.recipe.timeMinutes} 分钟</span>
              <span>${escapeHtml(m.recipe.category)}</span>
            </div>
            <div class="missing-note ${noteClass}">${escapeHtml(noteText)}</div>
          </button>
        `;
      }).join("");
    }

    function renderDetail() {
      const recipe = RECIPES.find((r) => r.id === state.currentRecipeId);
      const box = document.getElementById("detail-content");
      if (!recipe) {
        box.innerHTML = `<div class="empty">找不到这道菜</div>`;
        return;
      }
      const match = matchRecipe(recipe);

      box.innerHTML = `
        <div class="detail-hero">
          <h1>${escapeHtml(recipe.name)}</h1>
          <div class="meta-row">
            ${match ? `<span class="tag ${match.level}">${escapeHtml(match.label)}</span>` : ""}
            <span class="tag soft">${escapeHtml(recipe.difficulty)}</span>
            <span>约 ${recipe.timeMinutes} 分钟</span>
            <span>${escapeHtml(recipe.category)}</span>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>主料清单</h2></div>
          <div class="ing-list">
            ${recipe.mains.map((item) => renderIngRow(item)).join("")}
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>调料清单</h2></div>
          <div class="ing-list">
            ${recipe.seasonings.map((item) => renderIngRow(item)).join("")}
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>制作步骤</h2></div>
          <ol class="steps">
            ${recipe.steps.map((s) => `<li>${escapeHtml(s)}</li>`).join("")}
          </ol>
        </div>

        ${recipe.tips ? `<div class="tip-box">小提示：${escapeHtml(recipe.tips)}</div>` : ""}
      `;
    }

    function renderIngRow(item) {
      const have = ownsIngredient(item.name);
      const req = item.required ? "" : "（可选）";
      return `
        <div class="ing-row ${have ? "have" : "lack"}">
          <div class="left">
            <span class="name">${escapeHtml(item.name)}${req}</span>
            <span class="amount">${escapeHtml(item.amount || "")}</span>
          </div>
          <span class="status">${have ? "已有" : "缺少"}</span>
        </div>
      `;
    }

    /* ========== 工具 ========== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    let toastTimer = null;
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function runRecommend() {
      const start = performance.now();
      state.lastResults = recommend(6);
      state.fromResults = true;
      showView("results");
      // 保证交互感知，一般远小于 1s
      const cost = performance.now() - start;
      if (!state.lastResults.length) {
        toast("暂时没有可做的菜");
      } else if (cost < 30) {
        toast(`已为你找到 ${state.lastResults.length} 道菜`);
      }
    }

    /* ========== 事件 ========== */
    document.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", () => showView(btn.dataset.nav));
    });

    document.getElementById("btn-recommend").addEventListener("click", runRecommend);
    document.getElementById("btn-reshuffle").addEventListener("click", () => {
      state.lastResults = recommend(6);
      renderResults();
      toast(state.lastResults.length ? "已换一批" : "还是没有合适的菜");
    });

    document.getElementById("btn-back-results").addEventListener("click", () => {
      if (state.fromResults) showView("results");
      else showView("home");
    });

    document.getElementById("fridge-mains").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove-main]");
      if (!btn) return;
      removeFromFridge(btn.dataset.removeMain, false);
      renderHome();
    });

    document.getElementById("fridge-seasonings").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove-seasoning]");
      if (!btn) return;
      removeFromFridge(btn.dataset.removeSeasoning, true);
      renderHome();
    });

    function bindPicker(isSeasoning) {
      const presetId = isSeasoning ? "preset-seasonings" : "preset-mains";
      const searchId = isSeasoning ? "search-seasoning" : "search-main";
      const customId = isSeasoning ? "custom-seasoning" : "custom-main";
      const btnId = isSeasoning ? "btn-custom-seasoning" : "btn-custom-main";

      document.getElementById(presetId).addEventListener("click", (e) => {
        const btn = e.target.closest("[data-add-preset]");
        if (!btn) return;
        const name = btn.dataset.addPreset;
        const seasoning = btn.dataset.isSeasoning === "1";
        if (hasInFridge(name, seasoning)) {
          removeFromFridge(name, seasoning);
        } else {
          addToFridge(name, seasoning);
        }
        renderPresetPicker(seasoning, name);
      });

      document.getElementById(searchId).addEventListener("input", () => {
        renderPresetPicker(isSeasoning);
      });

      const addCustom = () => {
        const input = document.getElementById(customId);
        if (addToFridge(input.value, isSeasoning)) {
          input.value = "";
          renderPresetPicker(isSeasoning);
        }
      };
      document.getElementById(btnId).addEventListener("click", addCustom);
      document.getElementById(customId).addEventListener("keydown", (e) => {
        if (e.key === "Enter") addCustom();
      });
    }

    bindPicker(false);
    bindPicker(true);

    document.getElementById("result-list").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-open-recipe]");
      if (!btn) return;
      state.currentRecipeId = btn.dataset.openRecipe;
      showView("detail");
    });

    // 启动
    renderHome();
  </script>
</body>
</html>
